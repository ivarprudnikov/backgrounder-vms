name: Build and publish VMs
on:
  push:
    tags: ['**']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        profile: [ubuntu, debian, blender]
        include:
          - arch: amd64
            runner: ubuntu-24.04
            packages: qemu-system-x86
          - arch: arm64
            runner: ubuntu-24.04-arm
            packages: qemu-system-arm qemu-efi-aarch64
          - profile: ubuntu
            prefix: ubuntu-noble-minimal
          - profile: debian
            prefix: debian-trixie-generic
          - profile: blender
            prefix: ubuntu-noble-blender
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends genisoimage qemu-utils ${{ matrix.packages }}
      - run: python3 scripts/build.py --profile ${{ matrix.profile }} --arch ${{ matrix.arch }}
      - run: python3 scripts/smoke.py --profile ${{ matrix.profile }} dist/${{ matrix.prefix }}-${{ matrix.arch }}.qcow2 --output-dir preview
      - run: cd dist && sha256sum -c ${{ matrix.prefix }}-${{ matrix.arch }}.qcow2.sha256
      - if: matrix.profile == 'blender' && matrix.arch == 'amd64'
        uses: actions/upload-artifact@v4
        with:
          name: vm-blender-sample
          path: preview/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: vm-${{ matrix.profile }}-${{ matrix.arch }}
          path: dist/${{ matrix.prefix }}-${{ matrix.arch }}.qcow2*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vm-*
          merge-multiple: true
          path: dist
      - name: Verify and publish tested disks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        working-directory: dist
        run: |
          sha256sum -c {ubuntu-noble-minimal,debian-trixie-generic,ubuntu-noble-blender}-{amd64,arm64}.qcow2.sha256
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease --latest=false); fi
          gh release create --verify-tag --title "$TAG" \
            --notes "Ubuntu minimal, Debian generic and Ubuntu Blender QCOW2 disks. The cube scene and PNG were generated inside the amd64 Blender VM." \
            "${flags[@]}" -- "$TAG" *.qcow2 *.sha256 cube.blend cube.png
