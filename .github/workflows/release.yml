name: Build and publish VMs
on:
  push:
    tags: ['**']

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-24.04
    outputs:
      names: ${{ steps.discover.outputs.names }}
    steps:
      - uses: actions/checkout@v4
      - id: discover
        run: echo "names=$(python3 scripts/catalog.py)" >> "$GITHUB_OUTPUT"
  build:
    needs: catalog
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        vm: ${{ fromJSON(needs.catalog.outputs.names) }}
        include:
          - arch: amd64
            runner: ubuntu-24.04
            packages: qemu-system-x86
          - arch: arm64
            runner: ubuntu-24.04-arm
            packages: qemu-system-arm qemu-efi-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends genisoimage qemu-utils ${{ matrix.packages }}
      - run: python3 scripts/build.py --vm ${{ matrix.vm }} --arch ${{ matrix.arch }}
      - run: python3 scripts/test.py --vm ${{ matrix.vm }} --output-dir preview
      - run: cd dist && sha256sum -c ${{ matrix.vm }}-${{ matrix.arch }}.qcow2.sha256
      - if: matrix.arch == 'amd64' && hashFiles('preview/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: vm-${{ matrix.vm }}-sample
          path: preview/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: vm-${{ matrix.vm }}-${{ matrix.arch }}
          path: |
            dist/${{ matrix.vm }}-${{ matrix.arch }}.qcow2*
            dist/${{ matrix.vm }}-${{ matrix.arch }}.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  firmware:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: brew install qemu
      - name: Package architecture-specific QEMU resources
        run: |
          for arch in amd64 arm64; do
            python3 scripts/firmware.py --share "$(brew --prefix qemu)/share/qemu" --arch "$arch"
            unzip -t "dist/qemu-firmware-$arch.zip"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: vm-firmware
          path: dist/qemu-firmware-*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [catalog, build, firmware]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vm-*
          merge-multiple: true
          path: dist
      - name: Verify and publish tested disks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VMS: ${{ needs.catalog.outputs.names }}
        working-directory: dist
        run: |
          for vm in $(jq -r '.[]' <<< "$VMS"); do
            for arch in amd64 arm64; do
              sha256sum -c "$vm-$arch.qcow2.sha256"
              test -s "$vm-$arch.md"
            done
          done
          flags=()
          for arch in amd64 arm64; do
            sha256sum -c "qemu-firmware-$arch.zip.sha256"
          done
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease --latest=false); fi
          gh release create --verify-tag --title "$TAG" \
            --notes "Boot-tested QCOW2 disks, Markdown capability cards, and architecture-specific QEMU firmware archives with SHA-256 checksums." \
            "${flags[@]}" -- "$TAG" *
