name: Build and publish VMs
on:
  push:
    tags: ['**']

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-24.04
    outputs:
      names: ${{ steps.discover.outputs.names }}
    steps:
      - uses: actions/checkout@v4
      - id: discover
        run: echo "names=$(python3 scripts/catalog.py)" >> "$GITHUB_OUTPUT"
  build:
    needs: catalog
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        vm: ${{ fromJSON(needs.catalog.outputs.names) }}
        include:
          - arch: amd64
            runner: ubuntu-24.04
            packages: qemu-system-x86
          - arch: arm64
            runner: ubuntu-24.04-arm
            packages: qemu-system-arm qemu-efi-aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends genisoimage qemu-utils ${{ matrix.packages }}
      - run: python3 scripts/build.py --vm ${{ matrix.vm }} --arch ${{ matrix.arch }}
      - run: python3 scripts/test.py --vm ${{ matrix.vm }} --output-dir preview
      - run: cd dist && sha256sum -c ${{ matrix.vm }}-${{ matrix.arch }}.qcow2.sha256
      - if: matrix.arch == 'amd64' && hashFiles('preview/*') != ''
        uses: actions/upload-artifact@v4
        with:
          name: vm-${{ matrix.vm }}-sample
          path: preview/
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@v4
        with:
          name: vm-${{ matrix.vm }}-${{ matrix.arch }}
          path: |
            dist/${{ matrix.vm }}-${{ matrix.arch }}.qcow2*
            dist/${{ matrix.vm }}-${{ matrix.arch }}.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  firmware:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch the pinned Homebrew QEMU bottle
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_FROM_API: '1'
          CORE_REV: 73bba0545c75c9331f2a43a49ffd0cbffc4fc664
        run: |
          core=$(brew --repository homebrew/core)
          git init -q "$core"
          git -C "$core" fetch --depth=1 https://github.com/Homebrew/homebrew-core.git "$CORE_REV"
          git -C "$core" checkout --detach "$CORE_REV"
          brew fetch --bottle-tag=arm64_tahoe qemu
          bottle=$(brew --cache --bottle-tag=arm64_tahoe qemu)
          mkdir "$RUNNER_TEMP/firmware-keg"
          tar -xf "$bottle" -C "$RUNNER_TEMP/firmware-keg"
      - name: Package architecture-specific QEMU resources
        run: |
          for arch in amd64 arm64; do
            python3 scripts/firmware.py --share "$RUNNER_TEMP/firmware-keg/qemu/11.0.1/share/qemu" --arch "$arch"
            unzip -t "dist/qemu-firmware-$arch.zip"
          done
          cp LICENSE dist/LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: vm-firmware
          path: |
            dist/qemu-firmware-*
            dist/LICENSE
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [catalog, build, firmware]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: vm-*
          merge-multiple: true
          path: dist
      - name: Verify and publish tested disks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VMS: ${{ needs.catalog.outputs.names }}
        working-directory: dist
        run: |
          for vm in $(jq -r '.[]' <<< "$VMS"); do
            for arch in amd64 arm64; do
              sha256sum -c "$vm-$arch.qcow2.sha256"
              test -s "$vm-$arch.md"
            done
          done
          flags=()
          test -s LICENSE
          for arch in amd64 arm64; do
            sha256sum -c "qemu-firmware-$arch.zip.sha256"
          done
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease --latest=false); fi
          gh release create --verify-tag --title "$TAG" \
            --notes "Boot-tested QCOW2 disks, VM cards, and QEMU firmware. [Third-party notices and corresponding-source links](https://github.com/$GH_REPO/blob/$GITHUB_SHA/LICENSE). Each firmware ZIP also includes the notices." \
            "${flags[@]}" -- "$TAG" *
